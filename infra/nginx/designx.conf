server {
    listen 80;
    listen [::]:80;
    server_name designx.velax.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/workx-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://designx.velax.cn$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name designx.velax.cn;
    ssl_certificate /etc/letsencrypt/live/designx.velax.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/designx.velax.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/designx/current/dist;
    index index.html;
    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
